<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Flow</title>
<style>

.dt h5{margin:10px 0 4px;color:var(--mu)}

.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.d{padding:4px 0;border-radius:8px;border:0;font-size:13px}.d.has{box-shadow:inset 0 -3px var(--ac)}.d.now{background:var(--ac);color:#fff}

.x{border:0;padding:2px 8px}a{color:var(--ac);cursor:pointer}
html{-webkit-tap-highlight-color:transparent}button,input,select{touch-action:manipulation}
body{background-image:radial-gradient(60vmax 60vmax at 12% 8%,color-mix(in srgb,var(--ac) 50%,transparent),transparent 60%),radial-gradient(50vmax 50vmax at 92% 85%,#22d3ee55,transparent 60%),radial-gradient(40vmax 40vmax at 75% 0,#f472b655,transparent 60%)}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.card,.nav{background:linear-gradient(135deg,#ffffff30,#ffffff08),var(--cd);backdrop-filter:blur(var(--bl)) saturate(1.8);-webkit-backdrop-filter:blur(var(--bl)) saturate(1.8);border:1px solid #ffffff3d;box-shadow:inset 0 1px 0 #ffffff59,0 10px 34px #00000020;border-radius:22px}

.nav{top:calc(env(safe-area-inset-top,0px) + 8px);margin:8px auto;width:max-content;max-width:calc(100% - 16px);padding:6px;gap:2px;border-radius:99px;scrollbar-width:none}
.nav button{border:0;display:flex;align-items:center;gap:6px;border-radius:99px;padding:8px 12px}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 14px}.w2{grid-column:1/-1}
.kb{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}

.kt{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;margin-top:8px;cursor:grab}
.d.oc{text-decoration:underline dotted}
@media(max-width:720px){.nav{position:fixed;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;right:10px;width:auto;max-width:none;margin:0;justify-content:space-around}.nav span{display:none}.nav .on span{display:inline;font-size:12px}main{padding:10px 10px 110px}input,select,textarea{font-size:16px}.yg{grid-template-columns:1fr}.big{font-size:44px}}

#gb:hover{opacity:1}
#gb.bad{border-color:#ef4444;color:#ef4444}
.noa .dt{animation:none}
#gb{cursor:pointer}
</style></head><body><div id="app"></div>
<script>

<div class="card"><b>${t('summary')}</b><div class="row"><span class="chip" style="--c:#22c55e">${t('good')} ${gr}%</span><span class="chip" style="--c:#ef4444">${t('bad')} ×${bc}</span></div></div>

function vArchive(){const f=V.f,q=f.q.toLowerCase(),r=S.tasks.filter(x=>(!q||(x.title+x.note+x.date+(x.doneAt?ymd(new Date(x.doneAt)):'')+x.fields.map(y=>y.k+y.v).join()+x.sub.map(y=>y.t).join()).toLowerCase().includes(q))&&(!f.tag||x.tags.includes(f.tag))&&(!f.st||x.status===f.st)&&(!f.ds||(f.ds==='d')===!!x.done)&&(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to)).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),g={};
