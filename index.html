<style>

.noa .dt{animation:none}
#gb{cursor:pointer}
/* ===== v2: look & feel variables ===== */
body{font-family:var(--ff,system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans JP",sans-serif);font-size:calc(15px*var(--fs,1))}
body{background-image:radial-gradient(60vmax 60vmax at 12% 8%,color-mix(in srgb,var(--ac) 50%,transparent),transparent 60%),radial-gradient(50vmax 50vmax at 92% 85%,var(--g2,#22d3ee55),transparent 60%),radial-gradient(40vmax 40vmax at 75% 0,var(--g3,#f472b655),transparent 60%)}
.card,.nav{border-radius:var(--rad,22px)}.nav{border-radius:99px}
.kc{border-radius:calc(var(--rad,22px) - 4px)}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}.sw.on{border-color:var(--tx)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chk{display:flex;align-items:center;gap:6px}
html.standalone main{padding-top:calc(14px + env(safe-area-inset-top,0px))}
@media print{.nav,#gb{display:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),T0=()=>ymd(new Date()),uid=()=>Math.random().toString(36).slice(2,10),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const LI={en:0,fa:1,ja:2},LOC={en:'en-US',fa:'fa-u-ca-gregory',ja:'ja-JP'};

const t=k=>(L[k]||k).split('|')[LI[S.set.lang]]||k,lc=()=>LOC[S.set.lang],ot=s=>s.split('|')[LI[S.set.lang]];
const OC={'01-01':'New Year|سال نو میلادی|元日','02-14':"Valentine's Day|روز ولنتاین|バレンタイン",'03-20':'Nowruz (approx.)|نوروز (تقریبی)|ノウルーズ','12-25':'Christmas|کریسمس|クリスマス'};
const EM={work:'💼',کار:'💼',仕事:'💼',study:'📚',درس:'📚',勉強:'📚',health:'💪',سلامت:'💪',健康:'💪',home:'🏠',خانه:'🏠',家:'🏠',shop:'🛒',خرید:'🛒',買:'🛒',money:'💰',پول:'💰',金:'💰',idea:'💡',ایده:'💡',code:'💻',برنامه:'💻',urgent:'🔥',مهم:'⭐',meet:'👥',جلسه:'👥',会議:'👥',travel:'✈️',سفر:'✈️',旅:'✈️',food:'🍽️',غذا:'🍽️',sport:'🏃',ورزش:'🏃',運動:'🏃',read:'📖',مطالعه:'📖',読:'📖',call:'📞',تماس:'📞',sleep:'😴',خواب:'😴',water:'💧',آب:'💧',robot:'🤖',ربات:'🤖',circuit:'🔌',مدار:'🔌'};
const emo=n=>{n=n.toLowerCase();for(const k in EM)if(n.includes(k))return EM[k];return'🏷️'};
const P=[['',"#ef4444"],['',"#f59e0b"],['',"#3b82f6"],['',"#94a3b8"]];
const idb=new Promise(r=>{try{const q=indexedDB.open('flow',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const kv=(m,k,v)=>idb.then(d=>new Promise(r=>{if(!d)return r();try{const s=d.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch{r()}}));
const save=()=>persist(),sv=()=>{persist();render()},task=id=>S.tasks.find(x=>x.id===id),tg=id=>S.tags.find(x=>x.id===id),

function row(k){const o=V.open===k.id;return`<div class="card${k.done?' dn':''}"><div class="row"><button class="ck${k.done?' on':''}" data-a="tog" data-i="${k.id}">${k.done?'✓':''}</button><span class="pd" style="background:${P[k.prio][1]}"></span><b class="gr" data-a="open" data-i="${k.id}">${esc(k.title)}</b>${k.tags.map(tg).filter(Boolean).map(chip).join('')}${k.due?`<small>⏰ ${k.due.replace('T',' ')}</small>`:''}${k.done?`<small>✔ ${hhmm(k.doneAt)}</small>`:''}<small>${esc(k.status)}</small></div>${o?detail(k):''}</div>`}

<div class="row"><small>${t('due')}</small><input type="datetime-local" data-c="due" ${i} value="${k.due}"><small>${t('status')}</small><select data-c="status" ${i}>${S.set.st.map(s=>`<option${s===k.status?' selected':''}>${esc(s)}</option>`).join('')}</select></div>

<div class="row between"><small>${t('created')}: ${fmt(k.created)}${k.doneAt?' · '+t('doneat')+': '+fmt(k.doneAt):''}</small><button data-a="del" ${i}>🗑</button></div></div>`}
function vDay(){const d=V.date,all=S.tasks.filter(x=>x.date===d),pe=all.filter(x=>!x.done),dn=all.filter(x=>x.done).sort((a,b)=>a.doneAt-b.doneAt),od=pe.filter(x=>x.due&&new Date(x.due)<new Date()).length,st=S.set.st.map(s=>[s,all.filter(x=>x.status===s).length]).filter(x=>x[1]),oc=OC[d.slice(5)],cl=['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#14b8a6'][S.tags.length%7];
return`<div class="card"><div class="row between"><button data-a="dd" data-v="-1">‹</button><h2>${new Date(d+'T00:00').toLocaleDateString(lc(),{dateStyle:'full'})}</h2><button data-a="dd" data-v="1">›</button></div>${oc?`<small>🎉 ${ot(oc)}</small>`:''}
<div class="row"><span class="chip" style="--c:#3b82f6">${t('total')} ${all.length}</span><span class="chip" style="--c:#22c55e">${t('done')} ${dn.length}</span><span class="chip" style="--c:#f59e0b">${t('pending')} ${pe.length}</span><span class="chip" style="--c:#ef4444">${t('overdue')} ${od}</span>${st.map(s=>`<span class="chip" style="--c:#8b5cf6">${esc(s[0])} ${s[1]}</span>`).join('')}</div><div class="bar"><i style="width:${all.length?dn.length/all.length*100:0}%"></i></div></div>

function vHabits(){const d=V.hd,mo=d.slice(0,7),dm=new Date(+d.slice(0,4),+d.slice(5,7),0).getDate(),cnt=h=>{let c=0;for(let i=1;i<=dm;i++)if(S.hlog[mo+'-'+p(i)]?.[h.id])c++;return c};
const hr=h=>{const c=cnt(h),bad=h.type==='bad';return`<div class="card"><div class="row"><button class="ck${S.hlog[d]?.[h.id]?' on':''}" data-a="hab" data-i="${h.id}">✓</button><b class="gr">${h.emoji} ${esc(h.name)}</b><small>${c}/${dm}</small><button class="x" data-a="habdel" data-i="${h.id}">×</button></div><div class="bar"><i style="width:${c/dm*100}%;background:${bad?'#ef4444':'#22c55e'}"></i></div><div class="strip">${Array.from({length:dm},(_,i)=>`<u class="${S.hlog[mo+'-'+p(i+1)]?.[h.id]?'on':''}"></u>`).join('')}</div></div>`};
const G=S.habits.filter(h=>h.type!=='bad'),B=S.habits.filter(h=>h.type==='bad'),gr=G.length?Math.round(G.reduce((a,h)=>a+cnt(h)/dm,0)/G.length*100):0,bc=B.reduce((a,h)=>a+cnt(h),0);
